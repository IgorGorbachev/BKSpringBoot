version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: ronjke
      MYSQL_PASSWORD: ronjke
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: