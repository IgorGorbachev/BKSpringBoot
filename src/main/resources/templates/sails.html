        <div class="card-body">
            <form th:action="@{/addSail}" method="post" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Клиент</label>
                    <select class="form-select" name="klientId" required>
                        <option value="">Выберите клиента</option>
                        <option th:each="klient : ${klientList}"
                                th:value="${klient.id}"
                                th:text="${klient.name}"
                                th:selected="${lastSelectedKlientId != null and lastSelectedKlientId == klient.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Название</label>
                    <input type="text" name="nameSail" class="form-control" required>
                </div>
                <div class="col-md-1">
                    <label class="form-label">Артикул</label>
                    <input type="text" name="articul" class="form-control" required>
                </div>
                <div class="col-md-1">
                    <label class="form-label">Закупка</label>
                    <input type="number"
                           id="purchasePrice"
                           name="zakupka"
                           class="form-control"
                           required
                           oninput="calculatePrice()">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Цена</label>
                    <input type="number"
                           id="price"
                           name="price"
                           class="form-control"
                           oninput="calculateSum()"
                    >
                </div>
                <div class="col-md-1">
                    <label class="form-label">Количество</label>
                    <input type="number"
                           id="quantity"
                           name="kolichestvo"
                           class="form-control"
                           value="1"
                           min="1"
                           oninput="calculateSum()">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Сумма</label>
                    <input type="number"
                           id="summa"
                           name="summa"
                           class="form-control"
                           readonly>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Функция для расчета цены (закупка + 20%)
    function calculatePrice() {
        const purchasePriceInput = document.getElementById("purchasePrice");
        const priceInput = document.getElementById("price");

        const purchasePrice = parseFloat(purchasePriceInput.value) || 0;

        if (purchasePrice < 0) {
            alert("Цена закупки не может быть отрицательной!");
            purchasePriceInput.value = 0;
            return;
        }

        const priceWithMargin = purchasePrice * 1.2;
        const roundedPrice = Math.ceil(priceWithMargin / 10) * 10;
        priceInput.value = roundedPrice.toFixed(2);
        calculateSum();
    }

    // Функция для расчета суммы (цена * количество)
    function calculateSum() {
        const price = parseFloat(document.getElementById("price").value) || 0;
        const quantity = parseInt(document.getElementById("quantity").value) || 1;

        if (quantity < 1) {
            alert("Количество не может быть меньше 1!");
            document.getElementById("quantity").value = 1;
            return;
        }

        const sum = price * quantity;
        document.getElementById("summa").value = sum.toFixed(2);
    }

    // Функция для переключения в режим редактирования
    function enableEditMode(row) {
        // Сохраняем исходные значения
        const fields = ['nameSail', 'articul', 'zakupka', 'price', 'kolichestvo'];
        fields.forEach(field => {
            const viewText = row.querySelector(`.editable-field[data-field="${field}"] .view-text`);
            const editInput = row.querySelector(`.editable-field[data-field="${field}"] .edit-input`);
            row.dataset[`original${field}`] = viewText.textContent;
            editInput.value = viewText.textContent;
        });

        // Переключаем отображение
        row.querySelectorAll('.view-text').forEach(el => el.style.display = 'none');
        row.querySelectorAll('.edit-input').forEach(el => el.style.display = 'block');

        // Переключаем кнопки
        row.querySelector('.edit-btn').style.display = 'none';
        row.querySelector('.save-btn').style.display = 'inline-block';
        row.querySelector('.cancel-btn').style.display = 'inline-block';
        row.querySelector('.delete-btn').style.display = 'none';
    }

    // Функция для отмены редактирования
    function cancelEditMode(row) {
        // Восстанавливаем исходные значения
        const fields = ['nameSail', 'articul', 'zakupka', 'price', 'kolichestvo'];
        fields.forEach(field => {
            const viewText = row.querySelector(`.editable-field[data-field="${field}"] .view-text`);
            const editInput = row.querySelector(`.editable-field[data-field="${field}"] .edit-input`);
            viewText.textContent = row.dataset[`original${field}`];
            editInput.value = row.dataset[`original${field}`];
        });

        // Переключаем отображение
        row.querySelectorAll('.view-text').forEach(el => el.style.display = '');
        row.querySelectorAll('.edit-input').forEach(el => el.style.display = 'none');

        // Переключаем кнопки
        row.querySelector('.edit-btn').style.display = 'inline-block';
        row.querySelector('.save-btn').style.display = 'none';
        row.querySelector('.cancel-btn').style.display = 'none';
        row.querySelector('.delete-btn').style.display = 'inline-block';
    }

    // Инициализация при загрузке страницы
    document.addEventListener("DOMContentLoaded", function () {
        // Назначаем обработчики событий для формы добавления
        document.getElementById("purchasePrice").addEventListener("input", calculatePrice);
        document.getElementById("quantity").addEventListener("input", calculateSum);
        calculatePrice();

        // Обработчики для кнопок редактирования/сохранения/удаления
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                enableEditMode(this.closest('tr'));
            });
        });

        document.querySelectorAll('.cancel-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                cancelEditMode(this.closest('tr'));
            });
        });

        document.querySelectorAll('.save-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const row = this.closest('tr');
                const id = this.getAttribute('data-id');
                // const formData = new FormData();

                const data = {
                    sailId: id,
                    nameSail: row.querySelector('.editable-field[data-field="nameSail"] .edit-input').value,
                    articul: row.querySelector('.editable-field[data-field="articul"] .edit-input').value,
                    zakupka: row.querySelector('.editable-field[data-field="zakupka"] .edit-input').value,
                    price: row.querySelector('.editable-field[data-field="price"] .edit-input').value,
                    kolichestvo: row.querySelector('.editable-field[data-field="kolichestvo"] .edit-input').value,
                    statusId: row.querySelector('select[name="statusId"]').value,
                    oplataId: row.querySelector('select[name="oplataId"]').value
                };

                fetch('/changeSail', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams(data).toString()
                }).then(response => {
                    if (response.ok) {
                        cancelEditMode(row);
                        location.reload(); // Обновляем страницу после успешного сохранения
                    } else {
                        alert('Ошибка при сохранении изменений');
                    }
                }).catch(error => {
                    console.error('Error:', error);
                    alert('Ошибка при сохранении изменений');
                });
            });
        });

        // Функция для обновления статуса
        function updateStatus(sailId, statusId) {
            fetch('/changeSailStatus', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    sailId: sailId,
                    statusId: statusId
                })
            }).then(response => {
                if (!response.ok) {
                    alert('Ошибка при обновлении статуса');
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('Ошибка при обновлении статуса');
            });
        }

// Функция для обновления оплаты
        function updateOplata(sailId, oplataId) {
            fetch('/changeSailOplata', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    sailId: sailId,
                    oplataId: oplataId
                })
            }).then(response => {
                if (!response.ok) {
                    alert('Ошибка при обновлении оплаты');
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('Ошибка при обновлении оплаты');
            });
        }

// Функция для обновления внешнего вида после изменения
        function updateAppearance(selectElement, colorMap) {
            const selectedText = selectElement.options[selectElement.selectedIndex].text;
            const color = colorMap[selectedText] || 'ffffff';
            selectElement.style.backgroundColor = '#' + color;
        }


// Обработчики для изменения статуса и оплаты
        document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', function() {
                const sailId = this.getAttribute('data-sail-id');
                const statusId = this.value;
                updateStatus(sailId, statusId);
                updateAppearance(this, statusColors);
            });
        });

        document.querySelectorAll('.oplata-select').forEach(select => {
            select.addEventListener('change', function() {
                const sailId = this.getAttribute('data-sail-id');
                const oplataId = this.value;
                updateOplata(sailId, oplataId);
                updateAppearance(this, oplataColors);
            });
        });

        const statusColors = {
            "В пути": "ff0000",
            "Приехал, Не выдан": "ffc107",
            "Выдан": "28a745",
            "Возврат": "007bff"
        };

        const oplataColors = {
            "Не оплачено": "ff0000",
            "Наличные": "007bff",
            "Терминал": "ffc107",
            "Безнал (счет ОПЛАЧЕН)": "28a745",
            "Наличные + чек": "28a745",
            "Терминал + чек": "28a745",
            "Безнал (добавил в счет)": "808080",
            "Безнал (счет выставлен)": "ffc107"
        };


        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                if (confirm('Вы действительно хотите удалить эту продажу?')) {
                    const id = this.getAttribute('data-id');
                    const formData = new FormData();
                    formData.append('id', id);

                    fetch('/deleteSail', {
                        method: 'POST',
                        body: formData
                    }).then(response => {
                        if (response.ok) {
                            location.reload();
                        } else {
                            alert('Ошибка при удалении продажи');
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                        alert('Ошибка при удалении продажи');
                    });
                }
            });
        });
    });
</script>
