<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>База клиентов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Добавляем иконки Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        /* Ваши существующие стили */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            width: 10%;
            max-width: 140px;
            background-color: #343a40;
            padding: 90px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .content {
            margin-left: 5%;
            padding: 20px;
            width: 93.5%;
            transition: margin-left 0.3s ease;
            position: relative;
            top: 0;
        }
        .nav-link {
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
        }
        .view-mode {
            display: inline-block;
        }
        .edit-mode {
            display: none;
            width: 100%;
        }
        .action-buttons {
            white-space: nowrap;
        }
        .btn-group-sm > .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            line-height: 1.5;
            border-radius: 0.2rem;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            width: 10%;
            max-width: 140px;
            background-color: #343a40;
            padding: 90px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }

        /* Стиль для блока зарплаты */
        .weekly-salary {
            background-color: #495057;
            padding: 8px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav class="col-md-1 d-none d-md-block bg-dark sidebar">
    <div class="position-sticky pt-md-5">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/}">Все Клиенты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/allCars}">Все Автомобили</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/allDetails}">Все Детали</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/showSails}">Продажи</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/kassa}">Касса</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="http://localhost:8080/task">Задачи</a>
            </li>

            <!-- Блок с зарплатой за текущую неделю -->
            <li class="nav-item mt-4 p-2 bg-secondary rounded">
                <div class="text-white small">Зарплата за неделю:</div>
                <div class="text-warning fw-bold"
                     th:text="${weeklySalary != null ? #numbers.formatDecimal(weeklySalary, 1, 2, 'COMMA') + ' ₽' : 'Загрузка...'}">
                </div>
                <div class="text-white small"
                     th:text="'(' + ${#temporals.format(weekStart, 'dd.MM')} +
                         ' - ' + ${#temporals.format(weekEnd, 'dd.MM')} + ')'">
                </div>

            </li>
        </ul>
    </div>
</nav>



<!-- Основной контент -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 content">
    <div class="card mb-4">
        <div class="card-header">Долги нам</div>
        <div class="card-body">
            <table class="table table-dark table-hover">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Имя клиента</th>
                    <th scope="col">Долг</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="debt, iter : ${debts}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${debt[0]}"></td> <!-- Имя клиента -->
                    <td th:text="${#numbers.formatDecimal(debt[1], 1, 2, 'COMMA')} + ' руб.'"></td> <!-- Сумма долга -->
                </tr>
                <tr th:if="${debts.isEmpty()}">
                    <td colspan="3" class="text-center">Нет клиентов с задолженностью</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>


</main>
</body>
</html>
