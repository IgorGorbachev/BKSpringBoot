<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>База клиентов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Добавляем иконки Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        /* Ваши существующие стили */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            width: 10%;
            max-width: 140px;
            background-color: #343a40;
            padding: 90px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .content {
            margin-left: 5%;
            padding: 20px;
            width: 93.5%;
            transition: margin-left 0.3s ease;
            position: relative;
            top: 0;
        }
        .nav-link {
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
        }
        .view-mode {
            display: inline-block;
        }
        .edit-mode {
            display: none;
            width: 100%;
        }
        .action-buttons {
            white-space: nowrap;
        }
        .btn-group-sm > .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            line-height: 1.5;
            border-radius: 0.2rem;
        }
    </style>
</head>
<body>
<!-- Боковое меню -->
<nav class="col-md-1 d-none d-md-block bg-dark sidebar">
    <div class="position-sticky pt-md-5">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="/">Все Клиенты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/allCars">Все Автомобили</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/allDetails">Все Детали</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/showSails">Продажи</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/kassa">Касса</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/task">Задачи</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/search-page">Проценка</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Основной контент -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 content">

    <div class="card">
        <div class="card-header">Добавить новую задачу</div>
        <div class="card-body">
            <form th:action="@{/addTask}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Текст</label>
                    <input type="text" name="text" class="form-control" required>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Список задач</div>
        <div class="card-body">
            <table class="table table-dark table-hover">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Задача</th>
                    <th scope="col">Действие</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${taskList}">
                    <th scope="row" th:text="${task.id}"></th>
                    <td>
                        <span class="view-mode name-view" th:text="${task.text}"></span>
                        <input type="text" class="edit-mode form-control form-control-sm" name="text" th:value="${task.text}">
                    </td>
                    <td class="action-buttons">
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-primary edit-btn">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="btn btn-success save-btn" style="display:none;"
                                    th:attr="data-id=${task.id}">
                                <i class="bi bi-check"></i>
                            </button>
                            <button type="button" class="btn btn-warning cancel-btn" style="display:none;">
                                <i class="bi bi-x"></i>
                            </button>
                            <button type="button" class="btn btn-danger delete-btn" th:attr="data-id=${task.id}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Обработка редактирования
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const row = this.closest('tr');
                    // Сохраняем исходное значение
                    const originalText = row.querySelector('.name-view').textContent;
                    row.dataset.originalText = originalText;

                    // Переключаем режимы
                    row.querySelector('.name-view').style.display = 'none';
                    row.querySelector('.edit-mode').style.display = 'inline-block';

                    // Переключаем кнопки
                    this.style.display = 'none';
                    row.querySelector('.save-btn').style.display = 'inline-block';
                    row.querySelector('.cancel-btn').style.display = 'inline-block';
                    row.querySelector('.delete-btn').style.display = 'none';
                });
            });

            // Обработка отмены
            document.querySelectorAll('.cancel-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const row = this.closest('tr');
                    // Восстанавливаем значение
                    row.querySelector('.edit-mode').value = row.dataset.originalText;

                    // Переключаем режимы
                    row.querySelector('.name-view').style.display = 'inline-block';
                    row.querySelector('.edit-mode').style.display = 'none';

                    // Переключаем кнопки
                    row.querySelector('.edit-btn').style.display = 'inline-block';
                    row.querySelector('.delete-btn').style.display = 'inline-block';
                    this.style.display = 'none';
                    row.querySelector('.save-btn').style.display = 'none';
                });
            });

            // Обработка сохранения
            document.querySelectorAll('.save-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const row = this.closest('tr');
                    const id = this.getAttribute('data-id');
                    const newText = row.querySelector('.edit-mode').value.trim();

                    // Валидация
                    if (!newText) {
                        alert('Текст задачи не может быть пустым');
                        return;
                    }

                    // Показываем индикатор загрузки
                    const originalText = this.innerHTML;
                    this.innerHTML = '<i class="bi bi-hourglass-split"></i>';
                    this.disabled = true;

                    fetch('/changeTask?id=' + id + '&text=' + encodeURIComponent(newText), {
                        method: 'POST'
                    }).then(response => {
                        if (response.ok) {
                            // Обновляем текст в режиме просмотра
                            row.querySelector('.name-view').textContent = newText;

                            // Переключаем обратно
                            row.querySelector('.name-view').style.display = 'inline-block';
                            row.querySelector('.edit-mode').style.display = 'none';
                            row.querySelector('.edit-btn').style.display = 'inline-block';
                            row.querySelector('.delete-btn').style.display = 'inline-block';
                            this.style.display = 'none';
                            row.querySelector('.cancel-btn').style.display = 'none';
                        } else {
                            alert('Ошибка при сохранении изменений');
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                        alert('Ошибка при сохранении изменений');
                    }).finally(() => {
                        // Восстанавливаем кнопку
                        this.innerHTML = originalText;
                        this.disabled = false;
                    });
                });
            });

            // Обработка удаления задачи - ВЫНЕСЕНО ОТДЕЛЬНО
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const row = this.closest('tr');
                    const id = this.getAttribute('data-id');

                    if (confirm('Вы действительно хотите удалить эту задачу?')) {
                        // Показываем индикатор загрузки
                        const originalText = this.innerHTML;
                        this.innerHTML = '<i class="bi bi-hourglass-split"></i>';
                        this.disabled = true;

                        fetch('/deleteTask?id=' + id, {
                            method: 'POST'
                        }).then(response => {
                            if (response.ok) {
                                // Плавно скрываем и удаляем строку
                                row.style.transition = 'opacity 0.3s';
                                row.style.opacity = '0';
                                setTimeout(() => row.remove(), 300);
                            } else {
                                alert('Ошибка при удалении задачи');
                                // Восстанавливаем кнопку при ошибке
                                this.innerHTML = originalText;
                                this.disabled = false;
                            }
                        }).catch(error => {
                            console.error('Error:', error);
                            alert('Ошибка при удалении задачи');
                            // Восстанавливаем кнопку при ошибке
                            this.innerHTML = originalText;
                            this.disabled = false;
                        });
                    }
                });
            });
        });
    </script>

</main>

</body>
</html>
